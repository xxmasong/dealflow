services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dealflow
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealflow']
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dealflow:${POSTGRES_PASSWORD:-dealflow}@db:5432/dealflow
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - '8080:4000'

volumes:
  pgdata:

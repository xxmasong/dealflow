name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    # The unit tests run on embedded PGlite; this job checks the migrations and
    # the API against a real Postgres server too.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dealflow
          POSTGRES_USER: dealflow
          POSTGRES_PASSWORD: dealflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dealflow" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:seed --workspace @dealflow/api
        env:
          DATABASE_URL: postgres://dealflow:dealflow@localhost:5432/dealflow

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dealflow:ci .
